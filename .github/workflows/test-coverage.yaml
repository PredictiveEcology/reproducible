on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

name: test-coverage

jobs:
  test-coverage:
    runs-on: macOS-latest
    env:
      GOOGLEDRIVE_AUTH: ${{ secrets.GOOGLEDRIVE_AUTH }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: PredictiveEcology/actions/install-spatial-deps@v0.2

      - name: Export PROJ data dir on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          PROJ_DATA_DIR="$(brew --prefix proj)/share/proj"
          if [[ ! -f "$PROJ_DATA_DIR/proj.db" ]]; then
            echo "ERROR: proj.db not found in $PROJ_DATA_DIR"
            ls -la "$(brew --prefix proj)/share" || true
            exit 1
          fi
          echo "PROJ_LIB=$PROJ_DATA_DIR" >> "$GITHUB_ENV"
          echo "PROJ_DATA=$PROJ_DATA_DIR" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          Ncpus: 2
          use-public-rspm: false

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            rspatial/geodata

      - name: Test coverage
        run: covr::codecov(token = Sys.getenv("CODECOV_TOKEN"))
        shell: Rscript {0}
