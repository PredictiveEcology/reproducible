on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

name: test-coverage

jobs:
  test-coverage:
    runs-on: macOS-latest
    env:
      GOOGLEDRIVE_AUTH: ${{ secrets.GOOGLEDRIVE_AUTH }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      NOT_CRAN: true
      R_PKG_INSTALL_RETRIES: 3

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: PredictiveEcology/actions/install-spatial-deps@v0.2

      - uses: r-lib/actions/setup-r@v2
        with:
          Ncpus: 2
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          pak-version: stable
          extra-packages: |
            any::covr
            rspatial/geodata

      - id: covr
        name: Test coverage
        continue-on-error: true
        run: covr::codecov(token = Sys.getenv("CODECOV_TOKEN"))
        shell: Rscript {0}

      # covr's R CMD check sub-process writes test output to `test-all.Rout.fail`
      # on failure but the GHA log only sees an opaque
      # "Failure in <path>/test-all.Rout.fail". Surface the file so the actual
      # failing test names + tracebacks land in the workflow log.
      - if: steps.covr.outcome == 'failure'
        name: Dump test-all.Rout.fail on failure
        run: |
          set +e
          find /tmp /private/var/folders /private/tmp ~/Library 2>/dev/null \
              -name 'test-all.Rout.fail' -print0 \
            | while IFS= read -r -d '' f; do
                echo "=========================================="
                echo "=== $f ==="
                echo "=========================================="
                cat "$f"
              done
          exit 0

      - if: steps.covr.outcome == 'failure'
        name: Re-fail the job
        run: exit 1
