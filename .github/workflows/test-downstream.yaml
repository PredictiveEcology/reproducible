on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

name: test-downstream

jobs:
  test-downstream:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GOOGLEDRIVE_AUTH: ${{ secrets.GOOGLEDRIVE_AUTH }}
      NOT_CRAN: true
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

    steps:
      - name: Checkout reproducible
        uses: actions/checkout@v4
        with:
          path: reproducible

      - name: Checkout SpaDES.core
        uses: actions/checkout@v4
        with:
          repository: PredictiveEcology/SpaDES.core
          path: SpaDES.core

      - name: Checkout SpaDES.project
        uses: actions/checkout@v4
        with:
          repository: PredictiveEcology/SpaDES.project
          path: SpaDES.project

      - uses: PredictiveEcology/actions/install-spatial-deps@v0.2

      - uses: r-lib/actions/setup-r@v2
        with:
          Ncpus: 2
          use-public-rspm: false

      - name: Install pak
        run: install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable/")
        shell: Rscript {0}

      - name: Install NLMR from GitHub (not on CRAN, needed by SpaDES.core Suggests)
        run: pak::pak("ropensci/NLMR", ask = FALSE)
        shell: Rscript {0}

      - name: Install dependencies
        run: |
          pak::pak(
            c("local::reproducible", "local::SpaDES.core", "local::SpaDES.project",
              "any::rcmdcheck", "any::knitr", "any::rmarkdown"),
            dependencies = TRUE,
            ask = FALSE
          )
        shell: Rscript {0}

      - name: Check SpaDES.core
        run: |
          rcmdcheck::rcmdcheck(
            "SpaDES.core",
            args = c("--no-manual", "--as-cran", "--run-dontrun", "--run-donttest"),
            error_on = "error",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Check SpaDES.project
        run: |
          rcmdcheck::rcmdcheck(
            "SpaDES.project",
            args = c("--no-manual", "--as-cran", "--run-dontrun", "--run-donttest"),
            error_on = "error",
            check_dir = "check"
          )
        shell: Rscript {0}
